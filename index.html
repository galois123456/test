<script>
        // 본인의 Supabase URL과 Publishable Key를 입력하세요.
        const SUPABASE_URL = 'https://tuavghijkemkdwwsrkla.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_GC4faXT6iw-FV6QSsIhfbA_u0Lpt2CI'; 
        
        // 라이브러리 충돌을 방지하도록 변수 수정
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. 회원가입 기능
        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert("이메일과 비밀번호를 모두 입력해 주세요.");
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            
            if (error) alert("회원가입 에러: " + error.message);
            else alert("회원가입 성공! 로그인 버튼을 눌러보세요.");
        }

        // 2. 로그인 기능
        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                alert("로그인 에러: " + error.message);
            } else {
                document.getElementById('auth-status').innerText = `상태: 로그인 됨 (${data.user.email})`;
            }
        }

        // 3. 로그아웃 기능
        async function signOut() {
            const { error } = await supabaseClient.auth.signOut();
            if (error) alert("로그아웃 에러: " + error.message);
            else document.getElementById('auth-status').innerText = "상태: 로그아웃 됨";
        }

        // 4. 데이터 저장 기능
        async function saveData() {
            const memoContent = document.getElementById('memo').value;
            if (!memoContent) {
                alert("저장할 메모를 입력하세요.");
                return;
            }
            const { data, error } = await supabaseClient
                .from('messages')
                .insert([ { content: memoContent } ]);
            
            if (error) alert("저장 에러: " + error.message);
            else {
                alert("저장 완료!");
                document.getElementById('memo').value = '';
                loadData();
            }
        }

        // 5. 데이터 불러오기 기능
        async function loadData() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*');
                
            if (error) {
                alert("불러오기 에러: " + error.message);
                return;
            }

            const list = document.getElementById('memo-list');
            list.innerHTML = '';
            data.forEach(item => {
                const li = document.createElement('li');
                li.innerText = item.content;
                list.appendChild(li);
            });
        }
    </script>
