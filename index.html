<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase + Vercel 연동 테스트</title>
    <!-- Supabase 라이브러리 불러오기 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .section { background: #f5f5f5; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        input { padding: 8px; margin-bottom: 10px; width: calc(100% - 20px); }
        button { padding: 10px 15px; cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 4px; margin-right: 5px; }
        button:hover { background: #005bb5; }
    </style>
</head>
<body>

    <h1>🚀 내 웹앱 배포 테스트</h1>

    <!-- 로그인/회원가입 섹션 -->
    <div class="section">
        <h2>1. 로그인 테스트 (Auth)</h2>
        <input type="email" id="email" placeholder="이메일 주소">
        <input type="password" id="password" placeholder="비밀번호 (6자리 이상)">
        <button onclick="signUp()">회원가입</button>
        <button onclick="signIn()">로그인</button>
        <button onclick="signOut()" style="background: #333;">로그아웃</button>
        <p id="auth-status" style="font-weight: bold; color: green;">상태: 로그아웃 됨</p>
    </div>

    <!-- 데이터베이스 섹션 -->
    <div class="section">
        <h2>2. 데이터 저장 테스트 (Database)</h2>
        <p>※ Supabase에 'messages'라는 테이블과 'content'라는 텍스트 컬럼이 있어야 작동합니다.</p>
        <input type="text" id="memo" placeholder="저장할 메모 입력">
        <button onclick="saveData()">저장하기</button>
        <button onclick="loadData()">불러오기</button>
        <ul id="memo-list"></ul>
    </div>

    <script>
        // ★ 여기에 본인의 주소와 'eyJ'로 시작하는 긴 키를 넣으세요!
        const SUPABASE_URL = 'https://tuavghijkemkdwwsrkla.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_GC4faXT6iw-FV6QSsIhfbA_u0Lpt2CI'; 
        
        // ★ 에러 방지를 위해 supabaseClient로 변수명 변경!
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert("이메일과 비밀번호를 입력하세요.");
            
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert("회원가입 에러: " + error.message);
            else alert("회원가입 성공! 이제 로그인 버튼을 누르세요.");
        }

        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) alert("로그인 에러: " + error.message);
            else document.getElementById('auth-status').innerText = `상태: 로그인 됨 (${data.user.email})`;
        }

        async function signOut() {
            const { error } = await supabaseClient.auth.signOut();
            if (error) alert("로그아웃 에러: " + error.message);
            else document.getElementById('auth-status').innerText = "상태: 로그아웃 됨";
        }

        async function saveData() {
            const memoContent = document.getElementById('memo').value;
            if(!memoContent) return alert("메모를 입력하세요.");
            
            const { data, error } = await supabaseClient.from('messages').insert([ { content: memoContent } ]);
            if (error) alert("저장 에러: " + error.message);
            else {
                alert("저장 완료!");
                document.getElementById('memo').value = '';
                loadData();
            }
        }

        async function loadData() {
            const { data, error } = await supabaseClient.from('messages').select('*');
            if (error) return alert("불러오기 에러: " + error.message);

            const list = document.getElementById('memo-list');
            list.innerHTML = '';
            data.forEach(item => {
                const li = document.createElement('li');
                li.innerText = item.content;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
